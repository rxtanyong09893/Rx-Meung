<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดการด้านยาปฐมภูมิ เครือข่าย รพ.สต. อำเภอเมืองปัตตานี</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0a5e52;--g2:#0f8573;--g3:#e5f3ef;--g4:#f4faf8;--ink:#173029;--mut:#5b7069;--line:#d3e3de;--gold:#c9a227;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--blue:#1d5fa8;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--g4);color:var(--ink);font-family:'Sarabun','TH Sarabun New','TH SarabunPSK',sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-weight:600}h2{font-size:1.35rem;color:var(--g1)}h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* header */
.top{background:var(--g1);color:#fff;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:20}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.top .ttl{font-weight:600;font-size:1.05rem;line-height:1.2;flex:1;min-width:0}.top .ttl small{display:block;font-weight:300;opacity:.85;font-size:.8rem}
.chip{background:rgba(255,255,255,.14);border-radius:20px;padding:3px 12px;font-size:.85rem;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.85rem}
/* layout */
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{width:218px;background:#fff;border-right:1px solid var(--line);padding:12px 8px;flex:none}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;margin-bottom:2px}
.side a:hover{background:var(--g3)}.side a.on{background:var(--g1);color:#fff}
.side svg,.bnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{flex:1;padding:18px;min-width:0;max-width:1200px}
.bnav{display:none}
@media(max-width:860px){.side{display:none}.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;overflow-x:auto}
.bnav a{flex:1 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:.72rem;color:var(--mut);cursor:pointer;text-align:center}.bnav a.on{color:var(--g1);font-weight:600;box-shadow:inset 0 3px 0 var(--g1)}
main{padding:12px 12px 84px}.chip{display:none}}
/* components */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(10,94,82,.05)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.sp{justify-content:space-between}.grow{flex:1;min-width:150px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-left:5px solid var(--g2);border-radius:var(--r);padding:10px 14px}.stat b{display:block;font-size:1.7rem;color:var(--g1);line-height:1.2}.stat span{color:var(--mut);font-size:.9rem}
.stat.w{border-left-color:var(--warn)}.stat.d{border-left-color:var(--bad)}.stat.b{border-left-color:var(--blue)}
.btn{background:var(--g2);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500;min-height:40px}.btn:hover{background:var(--g1)}.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:#fff;color:var(--g1);border:1px solid var(--g2)}.btn.bad{background:var(--bad)}.btn.line{background:#06a74f}.btn.sm{padding:4px 10px;min-height:32px;font-size:.88rem}
label{display:block;font-weight:500;margin:8px 0 3px;font-size:.95rem}
input,select,textarea{width:100%;border:1px solid #b9cfc8;border-radius:8px;padding:8px 10px;background:#fff;min-height:42px;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
.fg{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.95rem}th{background:var(--g3);color:var(--g1);text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0}td{padding:7px 10px;border-top:1px solid #e6efec;vertical-align:top}
tr.clk{cursor:pointer}tr.clk:hover td{background:#f1f9f6}td.r,th.r{text-align:right}td.c,th.c{text-align:center}tr.sub td{background:#fafdfc;color:#35524a}tr.head td{background:#eef7f4;font-weight:600}
.badge{display:inline-block;border-radius:20px;padding:1px 10px;font-size:.82rem;font-weight:500;white-space:nowrap}
.b-pending{background:#fef3c7;color:#92400e}.b-processing{background:#e0e7ff;color:#3730a3}.b-approved,.b-active{background:#d1fae5;color:#065f46}.b-rejected,.b-disabled,.b-exp{background:#fee2e2;color:#991b1b}.b-cancelled{background:#e5e7eb;color:#374151}.b-near{background:#ffedd5;color:#9a3412}
.seg{display:inline-flex;border:1px solid var(--g2);border-radius:8px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}.seg button{border:0;background:#fff;padding:8px 16px;cursor:pointer;color:var(--g1)}.seg button.on{background:var(--g2);color:#fff}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:26px}
/* login */
.lg{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#dff1ec,#f4faf8 60%)}
.lgc{background:#fff;border-radius:14px;max-width:430px;width:100%;box-shadow:0 8px 30px rgba(10,94,82,.15);overflow:hidden;border-top:5px solid var(--gold)}
.lgh{background:var(--g1);color:#fff;text-align:center;padding:20px 16px}.lgh .logo{margin:0 auto 8px;width:88px;height:88px}.lgb{padding:18px 20px 22px}
.msg{padding:8px 12px;border-radius:8px;margin-top:10px;font-size:.93rem}.msg.e{background:#fee2e2;color:#991b1b}.msg.o{background:#d1fae5;color:#065f46}
/* หน้าหลัก: แผงกลุ่มข้อมูล + การ์ดสถานะแบบกระชับ */
.hh{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:8px}.hh h2{font-size:1.2rem}
.pn{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(10,94,82,.05)}
.pn>.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:32px}
.pn>.ph h3{font-size:1rem;color:var(--g1);display:flex;align-items:center;gap:7px}.pn>.ph h3 small{font-weight:400;font-size:.8rem}
.pn>.ph h3 svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(138px,1fr))}
.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--g2);border-radius:8px;background:var(--g4);padding:6px 10px;cursor:pointer;line-height:1.25}
button.tile:hover{background:var(--g3);border-color:var(--g2)}button.tile:focus-visible{outline:2px solid var(--g2)}
.tile b{display:block;font-size:1.45rem;color:var(--g1);line-height:1.15}.tile span{font-size:.83rem;color:var(--mut)}
.tile.w{border-left-color:var(--warn)}.tile.w b{color:var(--warn)}.tile.d{border-left-color:var(--bad)}.tile.d b{color:var(--bad)}.tile.b{border-left-color:var(--blue)}.tile.b b{color:var(--blue)}
.tile.z{border-left-color:#c5d6d0}.tile.z b{color:#8aa39b}.tile.st{cursor:default}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;font-weight:600;font-size:.92rem;color:var(--ink)}
.lnk{background:none;border:0;padding:0;color:var(--g2);cursor:pointer;text-decoration:underline;font-size:.88rem;font-weight:400}
.grid2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.grid3{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pn table{font-size:.9rem}.pn th,.pn td{padding:5px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chp{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--g4);border-radius:20px;padding:2px 11px;cursor:pointer;font-size:.85rem}.chp:hover{background:var(--g3);border-color:var(--g2)}.chp b{color:var(--g1)}.chp.z{opacity:.55}
@media(min-width:521px){.tiles.c3{grid-template-columns:repeat(3,1fr)}}
.pn .empty{padding:12px}.pn>.ph .btn,.pn>.ph .lnk{white-space:nowrap;flex:none}
@media(max-width:520px){.tiles{gap:6px}.tiles.c2,.tiles.c4{grid-template-columns:repeat(2,1fr)}.tiles.c3{grid-template-columns:repeat(3,1fr)}.tile{padding:5px 8px}.tile b{font-size:1.3rem}.tile span{font-size:.78rem}.pn>.ph h3 small{display:none}.pn{padding:9px 10px}.top .ttl{font-size:.92rem}.grid2,.grid3{grid-template-columns:1fr}}
/* modal / toast */
.mbg{position:fixed;inset:0;background:rgba(10,30,25,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.3)}.modal.wide{max-width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--g3);border-radius:12px 12px 0 0}.mh .x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--mut)}
.mb{padding:14px 16px 16px}.mf{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center}
.tst{background:#173029;color:#fff;padding:9px 18px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:92vw}.tst.e{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.5);z-index:99;display:grid;place-items:center}.spin{width:42px;height:42px;border:5px solid var(--g3);border-top-color:var(--g2);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;margin-bottom:10px}.kv b{color:var(--mut);font-weight:500}
/* A4 sheet (ใบเบิก / stock card) */
.sheet{background:#fff;color:#000;font-family:'Sarabun','TH SarabunPSK',sans-serif;font-size:15px;padding:18px;border:1px solid var(--line);min-width:640px}
.sheet .t1{text-align:center;font-weight:700;font-size:1.25em}.sheet .t2{text-align:center;font-weight:600;margin:4px 0 8px}
.sheet table{font-size:1em}.sheet th{background:#e8f3f0;color:#000;border:1px solid #000;text-align:center;position:static}.sheet td{border:1px solid #000}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:26px 10px;margin-top:22px;text-align:center}
#printArea{display:none}
@media print{@page{size:A4 portrait;margin:14mm}html,body{background:#fff;font-size:14pt}body>*:not(#printArea){display:none!important}#printArea{display:block!important}.sheet{border:0;padding:0;min-width:0;font-size:14pt}}
/* สร้างไฟล์ PDF ในเบราว์เซอร์ (ซ่อนจากหน้าจอ) */
.pdfhost{position:fixed;left:-10000px;top:0;background:#fff;color:#000}
.pdfdoc{background:#fff;color:#000}.pdfdoc .sheet{min-width:0;border:0;padding:0;font-size:12pt;line-height:1.3}.pdfdoc .sheet th{position:static;background:#e7e6e6}
.pdfdoc .sheet .t1,.pdfdoc .sheet .t2{font-size:1em}.pdfdoc .sheet td,.pdfdoc .sheet th{padding:1pt 3pt}.pdfdoc .sheet tr{break-inside:avoid}
</style>
<style>
/* พิมพ์จากหน้าเว็บ: TH SarabunPSK 16 (ถ้าเครื่องไม่มีฟอนต์นี้ ใช้ Sarabun 12 ซึ่งขนาดเท่ากันทางสายตา) */
@media print{
  #printArea .sheet,#printArea .sheet table{font-family:var(--pf,"TH SarabunPSK"),"TH Sarabun New","Sarabun",sans-serif!important;font-size:var(--ps,16pt)!important;line-height:1.15!important}
  #printArea .sheet .t1,#printArea .sheet .t2{font-size:1em!important;margin:0!important}
  #printArea .sheet table{width:100%!important;border-collapse:collapse;margin:4pt 0}
  #printArea .sheet th{background:#e7e6e6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;width:auto!important}
  #printArea .sheet th,#printArea .sheet td{padding:1pt 3pt!important;border:.75pt solid #000!important}
  #printArea .sheet thead{display:table-header-group}
  #printArea .sheet tr,#printArea .sigs{break-inside:avoid}
  #printArea .sigs{margin-top:18pt}
}
</style>
</head>
<body>
<div id="root"><div style="padding:60px 20px;text-align:center;color:#0a5e52;font-size:1.1rem">กำลังโหลดระบบ…</div></div>
<div id="printArea"></div>
<div id="toast"></div>
<div id="busy" class="hide"><div class="spin"></div></div>
<script>/* ถ้าโหลดไฟล์ใดไม่สำเร็จ แสดงสาเหตุแทนการค้างที่ "กำลังโหลดระบบ…" */
window.addEventListener('error', function (e) {
  var r = document.getElementById('root'); if (!r || !/กำลังโหลดระบบ/.test(r.textContent)) return;
  var src = e.target && (e.target.src || e.target.href), msg = src ? 'โหลดไฟล์ไม่สำเร็จ: ' + src : (e.message || 'ข้อผิดพลาดไม่ทราบสาเหตุ');
  r.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:16px 20px;border-radius:10px;background:#fee2e2;color:#991b1b;font-family:Sarabun,sans-serif">'
    + '<b>โหลดระบบไม่สำเร็จ</b><br>' + msg.replace(/</g, '&lt;') + '<br><small>ตรวจว่าใน GitHub มีโฟลเดอร์ js (app.js, app2.js, server.js) และไฟล์ config.js อยู่ชั้นเดียวกับ index.html</small></div>';
}, true);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/server.js"></script>
<script src="js/app.js"></script>
<script src="js/app2.js"></script>
</body>
</html>
